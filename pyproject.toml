[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makata"
version = "0.2.0"
description = "Zero-shot voice-cloning TTS server for Tagalog / Taglish / English"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["tts", "voice-cloning", "tagalog", "fastapi"]

dependencies = [
    "torch>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "coqui-tts[codec]>=0.27.5",
    "omnivoice",
    "librosa>=0.11",
    "soundfile>=0.12",
    "noisereduce>=3.0",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[project.scripts]
makata = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["frontend/*.html"]
